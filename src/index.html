<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width">
        <link rel="stylesheet" href ="style.css" />
        <script src="sender.js" defer></script>
        <title>Send a message</title>
    </head>
    <body>
        <h1>Send a message through vibrations</h1>
        <p>Write your message below:</p>
        <form id="form" onsubmit="return false">
            <div>
                <label for="message">Insert Message:</label>
                <input
                    type="text"
                    id="message"
                    name="message"
                    required
                    size="25"/>
            </div>
            
                <input type="submit"
                    id = "submit"
                    value="Send Message"/>
                <button type="button" id="stop" disabled = "true">Stop Sending</button>
        </form>
        
        <p>Status: <span class="displayText" id="displayStatus">Waiting for message...</span></p>
        <p>Message: <span class="displayText" id="displayMessage"></span></p>
        <p>Binary Output: <span class="displayText" id="displayBinaryOutput"></span></p>
    </body>
</html>
