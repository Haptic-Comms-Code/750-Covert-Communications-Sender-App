<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width">
        <link rel="stylesheet" href ="style.css" />
        <link rel="stylesheet" href ="hnl.mobileconsole.css"/>
        <!--<script src="https://cdn.jsdelivr.net/gh/c-kick/mobileConsole/hnl.mobileconsole.min.js" defer></script>-->
        <script src="hnl.mobileconsole.js" defer></script>
        <script src="receiver.js" defer></script>
        <title>Receive a message</title>
    </head>
    <body>
        <h1>Click the below button to activate the reciver</h1>
        <form id="form" onsubmit="return false">
            <div>
                <label for="message">Adjust sensitivity:</label>
                <input
                    type="number"
                    id="sensitivity"
                    name="sensitivity"
                    value="0.1"
                    step="any"
                    required
                    size="25"/>
            </div>
            <div>
                <label for="message">Adjust Samples Per Second (SPS):</label>
                <input
                    type="number"
                    id="sps"
                    name="sps"
                    value="240"
                    required
                    size="25"/>
            </div>
                <input type="submit"
                    id = "submit"
                    value="Adjust"/>
        </form>
        <p>Sensitivity: <span class="displayText" id="displaySensitivity"></span></p>
        <p>Samples Per Second (SPS): <span class="displayText" id="displaySPS"></span></p>
        <button type="button" id="start">Receive</button>
        <button type="button" id="stop" disabled>Stop Receiving</button>
        <p>Message: <span class="displayText" id="displayMessage"></span></p>

    </body>
</html>
